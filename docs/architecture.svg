<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">SafeSense two ESP32-S3 architecture</title>
  <desc id="desc">A BME680 connects to Node 1. Node 1 sends environmental probes to Node 2, which captures CSI, performs fusion, drives LEDs and a buzzer, persists events, and communicates with the laptop service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:2}.node{fill:#eef6ff;stroke:#2563eb;stroke-width:3}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.sub{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:16px Arial,sans-serif;fill:#334155}.label{font:600 15px Arial,sans-serif;fill:#0f172a}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.return{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="520" fill="#f8fafc"/>
  <text x="720" y="44" text-anchor="middle" class="title">SafeSense / WiSense — Implemented Two-Node Topology</text>

  <rect class="box" x="35" y="108" rx="16" width="205" height="180"/>
  <text x="60" y="145" class="sub">BME680</text>
  <text x="60" y="180" class="body">Temperature</text><text x="60" y="207" class="body">Humidity</text>
  <text x="60" y="234" class="body">Pressure</text><text x="60" y="261" class="body">Gas resistance</text>

  <rect class="node" x="310" y="78" rx="18" width="370" height="280"/>
  <text x="335" y="116" class="sub">Node 1 — ESP32-S3 Sensor / TX</text>
  <text x="335" y="153" class="body">Custom register-level BME680 driver</text>
  <text x="335" y="183" class="body">Gas baseline + relative risk</text>
  <text x="335" y="213" class="body">SafeSense-V2 SoftAP</text>
  <text x="335" y="243" class="body">50 Hz versioned UDP + CRC32</text>
  <text x="335" y="273" class="body">Probe traffic for CSI stimulus</text>
  <text x="335" y="303" class="body">Sensor status LED</text>

  <rect class="node" x="755" y="78" rx="18" width="390" height="280"/>
  <text x="780" y="116" class="sub">Node 2 — ESP32-S3 CSI Gateway</text>
  <text x="780" y="153" class="body">CSI capture → 100 × 48 window</text>
  <text x="780" y="183" class="body">Release-gated TinyML adapter</text>
  <text x="780" y="213" class="body">Deterministic fail-closed fusion</text>
  <text x="780" y="243" class="body">Green / yellow / red LEDs + buzzer</text>
  <text x="780" y="273" class="body">16-record NVS delivery queue</text>
  <text x="780" y="303" class="body">MQTT QoS 1 + exact application ACK</text>

  <rect class="box" x="1215" y="78" rx="18" width="195" height="280"/>
  <text x="1240" y="116" class="sub">Laptop</text>
  <text x="1240" y="153" class="body">MQTT broker</text><text x="1240" y="183" class="body">FastAPI</text>
  <text x="1240" y="213" class="body">SQLite</text><text x="1240" y="243" class="body">Streamlit</text>
  <text x="1240" y="273" class="body">Incident ACK</text><text x="1240" y="303" class="body">Review evidence</text>

  <path class="line" d="M240 198H310"/><text x="275" y="184" text-anchor="middle" class="label">I2C</text>
  <path class="line" d="M680 198H755"/><text x="718" y="167" text-anchor="middle" class="label">UDP env</text><text x="718" y="186" text-anchor="middle" class="label">+ CSI probes</text>
  <path class="line" d="M1145 198H1215"/><text x="1180" y="184" text-anchor="middle" class="label">MQTT</text>
  <path class="return" d="M1310 358C1310 440 950 450 950 358"/><text x="1130" y="446" text-anchor="middle" class="label">Exact ACCEPTED ACK for same event_id</text>
  <text x="720" y="495" text-anchor="middle" class="body">Host and ESP-IDF builds verified; physical electrical/radio evidence remains pending.</text>
</svg>
